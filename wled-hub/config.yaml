# Manifeste de l'add-on Home Assistant
# Realise par domo-lab31 - Kenny3231
name: "WLED Animations Hub"
version: "1.1.0"
slug: wled_hub
description: "241 animations pixel diffusees en UDP vers tes panneaux WLED, exposees dans Home Assistant"
url: "https://github.com/"
arch: [aarch64, amd64, armv7, armhf, i386]
init: false
# host_network : on envoie de l'UDP a 40 images/s vers le LAN, autant
# eviter la traduction d'adresses du reseau bridge de Docker.
host_network: true
# mqtt:need -> le Superviseur injecte automatiquement les identifiants
# du broker, aucun mot de passe a saisir dans la configuration.
services:
  - mqtt:need
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "API HTTP pour Node-RED"
options:
  fps: 40
  base_topic: wledhub
  discovery_prefix: homeassistant
  http_port: 8099
  panels:
    - id: panel01
      name: Panneau salon
      host: 192.168.1.50
      port: 21324
      width: 32
      height: 8
      mapping: serpentine-h
      flip_x: false
      flip_y: false
      brightness: 80
      animation: f1lights
schema:
  fps: int(10,60)
  base_topic: str
  discovery_prefix: str
  http_port: port
  panels:
    - id: match(^[a-z0-9_-]+$)
      name: str
      host: str
      port: port?
      width: int(8,256)
      height: int(8,64)
      mapping: list(progressive-h|serpentine-h|progressive-v|serpentine-v)?
      flip_x: bool?
      flip_y: bool?
      brightness: int(0,100)?
      animation: str?
      timeout: int(1,10)?
